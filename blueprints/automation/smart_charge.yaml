###############################################################################
# Disclaimer:
#
# Even though this automation has been created with care, the author cannot be
# responsible for any damages caused by this automation.  Use at your own risk.
#
###############################################################################
# Objective:
# - Use OCPP to charge EV from surplus solar and weather forecast.
#
# History:
# 2025-12-28 Inspiration from flashg1's Solar Charger Blueprint 2025-02-01.
###############################################################################
blueprint:
  name: Smart Charge OCPP Solar Charger Automation
  description: >
    Use OCPP to charge EV from surplus solar, use local battery for fast charging
    and use off peak tariff for fast charging.
    See [GitHub project page](https://github.com/BJReplay/ha-ocpp-charging-automation) for details.


    The following helpers must be defined with the exact names as shown below - you will need to create these yourself.
    They are prompted for by the blueprint so that you can create them if required - but you must use these names so that the other automations
    in the package to control charging and set default charge rates work.
      * Input Number: Smart Charge Set Amps (input_number.smart_charge_set_amps) - used to control smart charging power
      * Input Text: Charger Serial (input_text.charger_serial) - this is name of the OCPP charger - often it is just called "charger", 
        but might also be the serial number of the charger - and is used to derive the names of the sensors and controls of the OCPP charger.
      * Input Select (Dropdown) to choose Charge Mode (Off, Battery, Fast, Fixed, Smart)

    See [GitHub project page](https://github.com/BJReplay/ha-ocpp-charging-automation) for details on how to set these up.


    The following items are required as a minimum for a functional Blueprint:
      * Site (Grid) Power Sensor in Watts
      * Throttled Site Power Sensor based on Site (Grid) Power Sensor
      * Charging Amps Sensor in Amps for a tighter feedback loop - or just use Current Offered OCPP sensor

    Again, see [GitHub project page](https://github.com/BJReplay/ha-ocpp-charging-automation) for details on how to set these up.


    The following configs are optional:
      * Solar Power Sensor in Watts for Battery Boosted Solar Charging
      * Battery Power Sensor in Watts for Battery Boosted Solar Charging
      * Voltage Sensor in Volts (defaults to 230V)
      * Off Charging Amps (defaults to 0A)
      * Minimum Charging Amps (defaults to 6A)
      * Never Exceed Amps (defaults to 32A)
      * Excess Power Increase Increment Amps (defaults to 2A)
      * Safety Buffer - Power in Watts to use in Battery Boost Mode (defaults to 500W)
      * Available Battery Discharge Power in Watts (or 0 to not use local battery or no battery available) - e.g. 5000W for Tesla Powerwall 2
      * Battery Boost Reserve Level (stop using battery boost when local battery at this level - defaults to 100% - do not use battery) - e.g. 20% Reserve
      * Battery Boost Automatically Threshold (start using battery boost when local battery at this level - defaults to 0% - do not use) - e.g. 40% Threshold
      * Local Battery State of Charge (SoC) Sensor (defaults to 0 SoC if not supplied - local battery boost disabled)


    Helpers can be created on form or at Settings > Devices & Services > Helpers > Create helper.


    **Version**: v0.95

  domain: automation

  #####################################
  # Blueprint inputs
  #####################################
  input:
    predefined:
      name: Specified Names
      icon: mdi:newspaper-variant-multiple-outline
      description: Helpers that must have specified names to allow automations and blueprints to operation.
      input:
        set_amps:
          name: Smart Charge Set Amps
          description: >
            Input Number used to control smart charge rate.
            This input number is used to control another automation to set charge rate, and can be placed on a dashboard to manually control charge rate.
            You must name this "Smart Charge Set Amps" so that the resulting entity is called "input_number.smart_charge_set_amps" so that other automations
            can correctly utilise the same entity.
              * Default: input_number.smart_charge_set_amps
          default: input_number.smart_charge_set_amps
          selector:
            entity:
              domain:
                - input_number

        charger_serial:
          name: Charger Serial
          description: >
            This is name of the OCPP charger - often it is just called "charger", 
            but might also be the serial number of the charger - and is used to 
            derive the names of the sensors and controls of the OCPP charger.
            You must name this Charger Serial so that the resulting entity is called "input_text.charger_serial" so that other automations
            can correctly utilise the same entity.
              * Default: input_text.charger_serial
          default: input_text.charger_serial
          selector:
            entity:
              domain:
                - input_text

        charge_mode_select:
          name: Charge Mode Select
          description: >
            Input Select (Dropdown) to select Charge Mode.
            Specify an Input Select (defined in Home Assistant when you add a Helper as a new Dropdown) to choose the Charge Mode.
            You can automate the changing of the mode to align with your tariffs - for example, set it to Fast during free tariff periods, and to
            Smart when you want to use Excess Solar to charge from excess solar, or Fixed when you want to charge at a fixed rate.
            You must name this Charge Mode so that the resulting entity is called "input_select.charge_mode" so that other automations
            can correctly utilise the same entity.
              * Default: input_select.charge_mode
          default: input_select.charge_mode
          selector:
            entity:
              domain:
                - input_select

    mandatory:
      name: Mandatory Inputs
      icon: mdi:ev-plug-type2
      description: Mandatory Settings required to allow the Blueprint to run.
      input:
        power_sensor:
          name: Site (Grid) Power Sensor
          description: >
            Sensor that expresses negative value in Watts for available power for charging or positive value for consumed power.
            This sensor is the feedback loop for adjusting power consumption.
              * Default: sensor.site_power
          default: sensor.site_power
          selector:
            entity:
              domain:
                - sensor

        throttled_power_sensor:
          name: Throttled Site Power Sensor
          description: >
            Throttled Power Sensor that is a Time throttle filter based on Site (Grid) Power Sensor.
            This sensor determines how quickly the automation fires in response to changing solar power, household load, and other inputs.
            The suggested Filter is Time throttle and the suggested Window size is 15 seconds.
            This sensor is the feedback loop for adjusting charger output.
            See the [GitHub project page](https://github.com/BJReplay/ha-ocpp-charging-automation) for an example.
              * Default: sensor.throttled_site_power
          default: sensor.throttled_site_power
          selector:
            entity:
              domain:
                - sensor

        charging_amps_sensor:
          name: Charging Amps Sensor
          description: >
            Sensor that provides quick feedback on actual delivered current to the car charger.  If your charger reports Current Import, or you
            have a separate power meter on your charger, use this sensor (or a template sensor here).
            If not, specify the OCPP Current Offered sensor - as a sensor is needed for this blueprint.
              * Default:  sensor.charging_amps (e.g. template sensor)
              * Default:  Choose sensor.OCPP_charger_current_offered if you don't have a separate current meter.
          default: sensor.charging_amps
          selector:
            entity:
              domain:
                - sensor

    optional:
      name: Optional Inputs
      icon: mdi:chat-question-outline
      description: Optional Settings to override defaults or provide fine control.
      input:
        solar_sensor:
          name: Solar Power Sensor
          description: >
            Sensor that provides positive power in Watts for available power for charging when running in battery boost mode.
              * Default: sensor.solar_power
          default: sensor.solar_power
          selector:
            entity:
              domain:
                - sensor

        battery_sensor:
          name: Battery Power Sensor
          description: >
            Sensor that provides power in Watts for battery.  Power should be negative when flowing into battery, and positive when flowing from battery.
            Used to determine available power for battery boost - solar power less power being used to charge battery is used to determine household power consumption.
            Also used to determine if battery is being discharged into vehicle, and hiding insufficient power in Smart Charge mode (if not supplied, assumed zero)
              * Default: sensor.battery_power
              * Default: if not supplied, zero Watts assumed
          default: sensor.battery_power
          selector:
            entity:
              domain:
                - sensor

        voltage_sensor:
          name: Charger Line to Neutral voltage
          description: >
            Sensor or input number helper to specify charger voltage in Volts.
            Ideally specify a voltage source sensor so that power caculations are dynamic based on measured voltage, rather than assumed voltate.
            If not specified, assumed volate is used.
              * Default:  if no sensor or value supplied: 230V
              * Default:  sensor.voltage_source
          default: sensor.voltage_source
          selector:
            entity:
              domain:
                - sensor
                - input_number

        phases_input:
          name: Number of Phases
          description: >
            Number of phases used by charger - TODO - currently only single phase supported
              * Default:  1 Ø
          default: 1
          selector:
            number:
              min: 1
              max: 1
              mode: box

        never_exceed_amps_input:
          name: Charger maximum current
          description: >
            Specify charger maximum current in Ampere.
              * Default:  32A
          default: 32
          selector:
            number:
              min: 1
              max: 32
              unit_of_measurement: amp
              mode: box

        safety_buffer_input:
          name: Safety Buffer
          description: >
            Specify Battery Boost safety buffer in Watts.
              * Default:  500W
          default: 500
          selector:
            number:
              min: 1
              max: 1000
              unit_of_measurement: watt
              mode: box

        off_charging_amps_input:
          name: Charger turn off current
          description: >
            Specify charger turn off current in Amperes.
            If the charger current is set to less than 6A, some OCPP chargers will go into stand-by, but won't turn off.
            Other chargers will turn off.  Many OCPP chargers will turn off if the current is set to a value below 6A.
              * Default:  0A
          default: 0
          selector:
            number:
              min: 0
              max: 5
              unit_of_measurement: amp
              mode: box

        min_charging_amps_input:
          name: Charger minimum workable current
          description: >
            Specify charger minimum workable current in Amperes.
            If available current falls below the charger minimum workable current, the charge current will 
            be set to the Charger turn off current specified above.
            OCPP charger may require the minimum workable current to be set to 6A.
              * Default:  6A
          default: 6
          selector:
            number:
              min: 6
              max: 32
              unit_of_measurement: amp
              mode: box

        minimum_start_amps_input:
          name: Charger minimum start current
          description: >
            Specify charger start current in Amperes.
            If spare site current exceeds minimum start current, the charger can be started.
            OCPP charger may require the minimum start current to be set to 6A.
              * Default:  6A
          default: 6
          selector:
            number:
              min: 0
              max: 32
              unit_of_measurement: amp
              mode: box

        excess_increment_amps_input:
          name: Excess Power Increase Increment Amps
          description: >
            Specify excess power increase increment in Amperes.
            If there is excess power, the charger current will be increased by this increment.
            To avoid wild swings in power, and the control loop chasing equilibrium, especially if solar
            input is varying with cloud cover, or if household load is varying, a small increment of 2A (approx 500W)
            is the default chosen, but if you have a large solar array, or like to live on the edge, you can choose a
            larger value.
              * Default:  2A
          default: 2
          selector:
            number:
              min: 1
              max: 32
              unit_of_measurement: amp
              mode: box

        battery_discharge_power_input:
          name: Houshold battery discharge power
          description: >
            Available maximum battery discharge power to support household battery boost charging.
            This is specified in watts, and if allowed to default to zero will prevent battery boost charging
              * Default:  0W
          default: 0
          selector:
            number:
              min: 0
              max: 10000
              unit_of_measurement: watt
              mode: box

        battery_reserve_sensor:
          name: Battery Boost Reserve Charge
          description: >
            Input number helper to specify minimum home battery charge to hold.
            Ideally specify a input number helper that you can use to adjust the minimum reserve to hold at the end of
            battery boost sessions (or a fixed minimum reserve value) to be used.  If not specified, a reserve of 100%
            is used (i.e. battery boost is not used)
              * Default:  if no sensor or value supplied: 100%
              * Default:  input_number.battery_boost_reserve
          default: input_number.battery_boost_reserve
          selector:
            entity:
              domain:
                - input_number

        battery_threshold_sensor:
          name: Battery Boost Start Threshold
          description: >
            Input number helper or input to specify starting home battery charge to initiate battery boost charging.
            Ideally specify a input number helper that you can use to adjust the starting charge to intiate battery 
            boost sessions (or a fixed starting charge value) to be used.  If not specified, a reserve of 0% is used
            (i.e. battery boost is not used)
              * Default:  if no sensor or value supplied: 0%
              * Default:  input_number.battery_boost_start_threshold
          default: input_number.battery_boost_start_threshold
          selector:
            entity:
              domain:
                - input_number

        battery_soc_sensor:
          name: Home Battery State of Charge (SoC) Sensor
          description: >
            Sensor for home battery, or leave as blank for no home battery installed.
              * Default:  if no sensor or value supplied: 0%
              * Default:  sensor.battery_charge
          default: sensor.battery_charge
          selector:
            entity:
              domain:
                - sensor

        off_peak_end_sensor:
          name: End of Off Peak Helper
          description: >
            Datetime helper to specify end of off peak time.

            Ideally specify the same helper that you use to manage your tariffs / automation so that power when you switch off processes that
            utilise cheap power, they are sychronised to use this time.

            At this release, this time is used to check whether or not to enable battery boost charging: it is enabled (if all other tests allow
            it to be started) only before the end of off peak.  It is never started after the end of off peak, as it is assumed that the home
            battery is required for household load after the end of off peak.
          default: input_datetime.off_peak_energy_end
          selector:
            entity:
              domain:
                - input_datetime

###############################################################################
# Trigger variables
###############################################################################
trigger_variables:
  minimum_start_amps: !input minimum_start_amps_input
  power_id: !input power_sensor
  solar_id: !input solar_sensor
  battery_id: !input battery_sensor
  charging_amps_id: !input charging_amps_sensor
  voltage_id: !input voltage_sensor
  battery_reserve_id: !input battery_reserve_sensor
  battery_threshold_id: !input battery_threshold_sensor
  battery_soc_id: !input battery_soc_sensor
  off_peak_end_id: !input off_peak_end_sensor
  off_charging_amps: !input off_charging_amps_input
  min_charging_amps: !input min_charging_amps_input
  min_change_amps: !input excess_increment_amps_input
  never_exceed_amps: !input never_exceed_amps_input
  battery_discharge_power: !input battery_discharge_power_input
  safety_buffer: !input safety_buffer_input
  throttled_power_sensor_id: !input throttled_power_sensor
  charge_mode_select_id: !input charge_mode_select

###############################################################################
# Triggers
###############################################################################
triggers:
  - entity_id: !input throttled_power_sensor
    trigger: state
    id: "1"
    alias: When Throttled Site Power Changes
  - entity_id: !input charge_mode_select
    trigger: state
    id: "2"
    alias: When Charge Mode Changes

###############################################################################
# Conditions
###############################################################################
conditions:
  - condition: template
    value_template: "{{ states(charge_mode_select_id) != 'Off' }}"
    alias: If Charge Mode is not Off
  - condition: template
    value_template: "{{ charge_control_on or connector_status_charging }}"
    alias: If Charging

###############################################################################
# Actions
###############################################################################
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ states(charge_mode_select_id) == 'Fast' }}"
            alias: Charge Mode is Fast
        sequence:
          - action: input_number.set_value
            metadata: {}
            data:
              value: "32"
            target:
              entity_id: input_number.smart_charge_set_amps
            alias: Set Charge Amps to 32
          - if:
              - condition: state
                entity_id: timer.turn_off_car_charger
                state: active
            then:
              - action: timer.cancel
                target:
                  entity_id: timer.turn_off_car_charger
                data: {}
            alias: Cancel Turn Off Timer if Running
      - conditions:
          - condition: template
            value_template: "{{ states(charge_mode_select_id) == 'Battery' }}"
            alias: Charge Mode is Battery
        sequence:
          - if:
              - condition: state
                entity_id: timer.turn_off_car_charger
                state: active
            then:
              - action: timer.cancel
                target:
                  entity_id: timer.turn_off_car_charger
                data: {}
            alias: Cancel Turn Off Timer if Running
        alias: If Charge Mode is Battery Boost
      - conditions:
          - condition: template
            value_template: "{{ states(charge_mode_select_id) == 'Fixed' }}"
            alias: Charge Mode is Fixed
        sequence:
          - if:
              - condition: state
                entity_id: timer.turn_off_car_charger
                state: active
            then:
              - action: timer.cancel
                target:
                  entity_id: timer.turn_off_car_charger
                data: {}
            alias: Cancel Turn Off Timer if Running
      - conditions:
          - condition: template
            value_template: "{{ charge_control_on or connector_status_charging }}"
            alias: If Charging
          - condition: template
            value_template: "{{ dampened_spare_amps > 0 }}"
            alias: If Spare Amps
          - condition: template
            value_template: "{{ current_charging_amps < max_charging_amps }}"
            alias: If Headroom
        sequence:
          - data:
              name: Smart Charge
              message: >-
                Charger is on and we have {{ dampened_spare_amps }} spare amps.
                Already at {{ current_charging_amps }} amps. Attempting to
                increase charge rate to {{ new_charge_amps | int }} amps
            action: logbook.log
          - if:
              - condition: state
                entity_id: timer.turn_off_car_charger
                state: active
            then:
              - action: timer.cancel
                target:
                  entity_id: timer.turn_off_car_charger
                data: {}
            alias: Cancel Turn Off Timer if Running
          - action: input_number.set_value
            metadata: {}
            data:
              value: "{{ new_charge_amps | int }}"
            target:
              entity_id: input_number.smart_charge_set_amps
        alias: If charging, and excess power
      - conditions:
          - condition: template
            value_template: "{{ charge_control_on or connector_status_charging }}"
            alias: If Charging
          - condition: template
            value_template: "{{ new_charge_amps < min_charging_amps }}"
            alias: If new charge amps < min charge amps
        sequence:
          - data:
              name: Smart Charge
              message: >-
                Charger is on and we do not have enough excess power to even
                charge at {{ min_charging_amps }}A. Turning off charger in 2
                minutes. (new_charge:{{ new_charge_amps }}A < min_charging:{{
                min_charging_amps }}A) (current_charging:{{
                current_charging_amps }}A + spare:{{ dampened_spare_amps }}A)
                (power out:{{ spare_energy }})
            action: logbook.log
          - action: input_number.set_value
            metadata: {}
            data:
              value: "{{ min_charging_amps }}"
            target:
              entity_id: input_number.smart_charge_set_amps
          - alias: If Turn Off timer is paused or idle, Start Turn Off Timer
            if:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: timer.turn_off_car_charger
                    state: idle
                  - condition: state
                    entity_id: timer.turn_off_car_charger
                    state: paused
                alias: If Turn Off timer is paused or idle
            then:
              - target:
                  entity_id: timer.turn_off_car_charger
                data:
                  duration: "00:03:02"
                action: timer.start
                alias: Start Turn Off Timer
        alias: If charging, and below minimum amps
      - conditions:
          - condition: template
            value_template: "{{ charge_control_on or connector_status_charging }}"
            alias: If Charging
          - condition: template
            value_template: "{{ dampened_spare_amps < 0 }}"
            alias: If insufficient amps
        sequence:
          - variables:
              temp_charge_amps: "{{ [min_charging_amps, new_charge_amps] | max }}"
          - data:
              name: Smart Charge
              message: >-
                Charger is on and we are using {{ dampened_spare_amps }} too
                many amps. Attempting to decrease charge rate to:{{
                temp_charge_amps }}
            action: logbook.log
          - action: input_number.set_value
            metadata: {}
            data:
              value: "{{ temp_charge_amps | int }}"
            target:
              entity_id: input_number.smart_charge_set_amps
          - alias: If Turn Off timer is paused or idle, Start Turn Off Timer
            if:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: timer.turn_off_car_charger
                    state: idle
                  - condition: state
                    entity_id: timer.turn_off_car_charger
                    state: paused
                alias: If Turn Off timer is paused or idle
            then:
              - target:
                  entity_id: timer.turn_off_car_charger
                data:
                  duration: "00:03:02"
                action: timer.start
                alias: Start Turn Off Timer
        alias: If charging, and deficit excess
    default:
      - if:
          - condition: numeric_state
            entity_id: sensor.battery_power
            below: 50
        then:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: timer.turn_off_car_charger
                    state: active
                sequence:
                  - target:
                      entity_id: timer.turn_off_car_charger
                    action: timer.cancel
                    data: {}
            alias: Cancel Timer
        alias: Cancel Timer if Household Battery is not Discharging

###############################################################################
# Variables
###############################################################################
variables:
  charger_id: "{{ states('input_text.charger_serial') }}"
  connector: "{{ charger_id ~ '_status_connector' }}"
  connector_id: "{{ 'sensor.' ~ connector }}"
  control: "{{ charger_id ~ '_charge_control' }}"
  control_id: "{{ 'switch.' ~ control }}"
  current: "{{ charger_id ~ '_maximum_current' }}"
  current_id: "{{ 'number.' ~ current }}"
  status_connector: "{{ states.sensor[connector].state }}"
  charge_control: "{{ states.switch[control].state }}"
  maximum_current: "{{ states.number[current].attributes.max }}"
  max_charging_amps: "{{ maximum_current | int(never_exceed_amps) }}"
  current_charging_amps: "{{ states(charging_amps_id) | float(0) }}"
  site_power: "{{ states(power_id) | float(0) }}"
  solar_power: "{{ states(solar_id) | float(0) }}"
  battery_charging_power: "{{ [ states(battery_id) | float(0) * -1.0, 0.0 ] | max }}"
  battery_discharging_power: "{{ [ states(battery_id) | float(0), 0.0 ] | max }}"
  voltage: "{{ states(voltage_id) | float(230) }}"
  net_solar_power: "{{ (solar_power - battery_charging_power) | float(0) }}"
  battery_reserve: "{{ states(battery_reserve_id) | float(100) }}"
  battery_threshold: "{{ states(battery_threshold_id) | float(0) }}"
  battery_soc: "{{ states(battery_soc_id) | float(0) }}"
  battery_boost: >-
    {{ true if battery_soc > battery_threshold and now() <
    today_at(states(off_peak_end_id)) and states(charge_mode_select_id) ==
    'Smart' else false | bool }}
  local_power: "{{ (battery_discharge_power - safety_buffer) if battery_boost else 0 + net_solar_power | float(0) }}"
  local_amps: "{{ (local_power / voltage) if battery_boost else 0 | float(0) }}"
  battery_amps: "{{ 0 if battery_boost else (battery_discharging_power / voltage) | float(0) }}"
  excess_amps: "{{ (( (site_power - local_power + battery_charging_power) / voltage ) * -1.0 | float(0)) - current_charging_amps - battery_amps }}"
  battery_boost_deficit: >-
    {{ 0.0 - excess_amps if states(charge_mode_select_id) == 'Battery' or
    battery_boost else 0 | round(0, 'floor') | int }}
  spare_amps: >-
    {{ local_amps - battery_boost_deficit if states(charge_mode_select_id) ==
    'Battery' or battery_boost else excess_amps if
    states(charge_mode_select_id) == 'Smart' else 0 | round(0, 'floor') |
    int }}
  backup_spare_amps: >-
    {{ excess_amps if states(charge_mode_select_id) != 'Fast' else 0 |
    round(0, 'floor') | int }}
  min_start_amps: "{{ minimum_start_amps | float(6) }}"
  min_inc_amps: "{{ min_change_amps | int(2) }}"
  dampened_spare_amps: >-
    {{ [spare_amps, min_start_amps if (spare_amps > min_start_amps and
    current_charging_amps < min_start_amps) else min_inc_amps ] | min | round(0,
    'floor') | int }}
  working_charge_amps: "{{ (current_charging_amps + dampened_spare_amps) | int }}"
  new_charge_amps: >-
    {{ working_charge_amps if working_charge_amps >= min_charging_amps else
    min_charging_amps }}
  charge_control_on: "{{ charge_control == 'on' }}"
  connector_status_charging: "{{ status_connector == 'Charging' }}"

mode: single
trace:
  stored_traces: 30
